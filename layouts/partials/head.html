{{ partial "head/meta-tags.html" . }}

{{ if .Params.canonicalUrl }}
<link rel="canonical" href="{{ .Params.canonicalUrl }}">
{{ else }}
<link rel="canonical" href="{{ .Permalink }}">
{{ end }}

<link rel="icon" href="{{ "favicon.ico" | relURL }}" sizes="32x32">
<link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">

{{ partialCached "head/math.html" . }}
{{ partialCached "head/theme-styles.html" . }}

{{ if .IsHome }}{{ partial "head/hugo-generator.html" . }}{{ end }}

<script defer src="{{ "js/inline-punctuation.js" | relURL }}"></script>
<script defer src="{{ "js/site.js" | relURL }}"></script>
<script defer src="{{ "js/local-time.js" | relURL }}"></script>
