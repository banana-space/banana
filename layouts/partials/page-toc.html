<aside class="toc-shell" aria-label="{{ i18n "table_of_contents" }}">
  <details class="toc-disclosure" open>
    <summary><span id="toc-label">{{ i18n "table_of_contents" }}</span>{{ partial "ui-icon.html" "chevron" }}</summary>
    <p class="toc-sidebar-title" aria-hidden="true">{{ i18n "table_of_contents" }}</p>
    <nav id="TableOfContents" aria-label="{{ i18n "table_of_contents" }}"><ul class="toc-list directory-tree">{{ . | safeHTML }}</ul></nav>
  </details>
</aside>
