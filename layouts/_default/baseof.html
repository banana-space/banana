<!DOCTYPE html>
<html lang="{{ .Params.lang | default .Site.Language.Lang }}"{{ if hugo.IsDevelopment }}{{ with .File }} data-source="{{ .Path }}"{{ end }}{{ end }}{{ with .Params.typography }}{{ if eq .convertChineseFullStop false }} data-typography-full-stop="false"{{ end }}{{ end }}>

<head>
  <title>{{ block "title" . }}{{ .Site.Title }}{{ end }}</title>
  {{ partial "head.html" . }}
</head>

<body class="wrapper">
  {{ partial "header.html" . }}

  <main class="content">
    {{ block "content" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}
</body>

</html>
