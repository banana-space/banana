# The test suite (npm test), for changes to the build rather than to content.
# The tests build small fixture sites; they do not build the real site.
name: Test

on:
  pull_request:
    paths: &paths
      - 'scripts/**'
      - 'packages/**'
      - 'site/**'
      - 'data/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test.yml'
  push:
    branches: [main]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The test files in three parts, each on a machine of its own: a runner has 4 vCPUs but runs only about two
    # test files at the speed of one.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: test (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci

      - run: npm test -- --shard ${{ matrix.shard }}/3
