baseURL = 'https://bananaspace.org/'
locale = 'zh-cn'
defaultContentLanguage = 'zh-cn'
title = '香蕉空间'
pagination.pagerSize = 50

contentDir = '.build/content'
disableKinds = ['RSS']
disableAliases = true

# KaTeX 样式与字体来自 npm 包，版本须与 Hugo 内置的 KaTeX 渲染器保持一致。
# 声明任何 assets/static 挂载后，Hugo 不再使用默认挂载，因此须同时列出项目目录。
[[module.mounts]]
source = 'assets'
target = 'assets'
[[module.mounts]]
source = 'node_modules/katex/dist/katex.css'
target = 'assets/katex/katex.css'
# 编辑器在浏览器中运行预处理的解析（assets/js/editor/check.js），由 js.Build 从这里引用；不会发布。
[[module.mounts]]
source = 'scripts'
target = 'assets/js/scripts'
[[module.mounts]]
source = 'static'
target = 'static'
[[module.mounts]]
source = 'node_modules/katex/dist/fonts'
target = 'static/katex/fonts'
files = ['*.woff2']
[[module.mounts]]
source = 'node_modules/katex/LICENSE'
target = 'static/katex/LICENSE'

# 首页另外输出搜索清单，postbuild 据此建立索引后删除。
[outputFormats.searchmanifest]
mediaType = 'application/json'
baseName = 'search-manifest'
isPlainText = true
notAlternative = true
[outputs]
home = ['html', 'searchmanifest']

[frontmatter]
lastmod = ['gitLastmod']

[taxonomies]
category = 'categories'

[params]
description = '中文数学百科'

# use external CSS
[markup.highlight]
noClasses = false

# Generated formula tokens contain the complete TeX expression in base64.
[markup.goldmark.extensions.passthrough]
enable = true
[markup.goldmark.extensions.passthrough.delimiters]
inline = [['@@math:', ':math@@']]
block = [['@@displaymath:', ':displaymath@@'], ['@@numberedmath:', ':numberedmath@@']]

# Images alone in a paragraph become figures (render-image.html checks .IsBlock).
[markup.goldmark.parser]
wrapStandAloneImageWithinParagraph = false

[markup.goldmark.parser.attribute]
title = true
